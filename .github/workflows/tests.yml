name: Regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ultimate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ultimate/requirements-test.txt

      - name: System packages (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-dejavu-core libfribidi0

      - name: Python packages
        run: pip install -r requirements-test.txt

      - name: Unit tests
        run: pytest -q

      - name: Start Milvus and Redis
        run: |
          docker run -d --name xocr-milvus -p 19530:19530 -p 9091:9091 \
            -e ETCD_USE_EMBED=true -e ETCD_DATA_DIR=/var/lib/milvus/etcd -e COMMON_STORAGETYPE=local \
            milvusdb/milvus:v2.3.1 milvus run standalone
          docker run -d --name xocr-redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9091/healthz && break; sleep 3; done

      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
          XOCR_MILVUS_CONTAINER: xocr-milvus
        run: pytest -q
