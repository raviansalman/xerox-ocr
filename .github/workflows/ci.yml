name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[dev,answer]"
      - name: Lint
        run: ruff check docintel scripts tests
      - name: No hardcoded production data
        run: python scripts/check_hardcoded.py
      - name: Code security scan
        run: bandit -q -c pyproject.toml -r docintel
      - name: Dependency vulnerabilities
        run: pip-audit

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-dejavu-core
      - run: pip install -e ".[dev,answer]"
      - run: pytest -q tests/unit

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # "standin": deterministic stand-in embedder and Milvus; "disabled": no vector index at all. Exact, lexical,
        # structured and contextual retrieval must pass in both.
        vectors: [standin, disabled]
    services:
      postgres:
        image: postgres:16.4-bookworm
        env: { POSTGRES_PASSWORD: postgres }  # hardcoded-ok(credential): throwaway CI database
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DOCINTEL_TEST_E2E: "1"
      DOCINTEL_TEST_DATABASE_URL: postgresql://docintel_app:ci-only@127.0.0.1:5432/docintel_test  # hardcoded-ok(url-credential): throwaway CI database
      DOCINTEL_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres  # hardcoded-ok(url-credential): throwaway CI database
      DOCINTEL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DOCINTEL_EVAL_REPORT_DIR: ${{ github.workspace }}/eval-reports
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-dejavu-core \
            libreoffice-writer-nogui postgresql-client
      - name: Milvus
        if: matrix.vectors == 'standin'
        run: |
          docker run -d --name milvus -p 19530:19530 -p 9091:9091 -e ETCD_USE_EMBED=true \
            -e ETCD_DATA_DIR=/var/lib/milvus/etcd -e COMMON_STORAGETYPE=local -e DEPLOY_MODE=STANDALONE \
            milvusdb/milvus:v2.6.3 milvus run standalone
          echo "DOCINTEL_TEST_MILVUS_URI=http://127.0.0.1:19530" >> "$GITHUB_ENV"
      - name: Semantic search disabled
        if: matrix.vectors == 'disabled'
        run: echo "DOCINTEL_TEST_VECTORS=disabled" >> "$GITHUB_ENV"
      - name: Application role without superuser or BYPASSRLS
        env: { PGPASSWORD: postgres }  # hardcoded-ok(credential): throwaway CI database
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE docintel_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-only'"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE docintel_test OWNER docintel_app TEMPLATE template0 LC_COLLATE 'C.UTF-8' LC_CTYPE 'C.UTF-8'"
          psql -h 127.0.0.1 -U postgres -d docintel_test -c "CREATE EXTENSION pg_trgm"
      - run: pip install -e ".[dev,answer]" && python -m playwright install --with-deps chromium
      - name: Wait for Milvus
        if: matrix.vectors == 'standin'
        run: for i in $(seq 1 60); do curl -fs http://127.0.0.1:9091/healthz && exit 0; sleep 3; done; docker logs milvus; exit 1
      - run: pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: "evaluation-${{ matrix.vectors }}", path: eval-reports, if-no-files-found: ignore }

  deployment:
    # A clean machine: build both images from the repository, start the complete compose stack and run the
    # end-to-end verification (every upload format, each kind of question, cross-tenant access, dependency restarts,
    # reprocessing, deletion from every index, metrics).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - name: Throwaway secrets and API keys
        run: |
          python - "$RUNNER_TEMP" <<'PY'
          import hashlib, json, pathlib, secrets, sys
          d = pathlib.Path(sys.argv[1])
          keys = {t: secrets.token_urlsafe(32) for t in ("alpha", "beta")}
          (d / "api_keys.json").write_text(json.dumps([{"name": f"{t}_admin", "tenant": t, "roles": ["admin"],
              "key_sha256": hashlib.sha256(k.encode()).hexdigest()} for t, k in keys.items()]))
          (d / "keys.json").write_text(json.dumps(keys))
          (d / "deploy.env").write_text("\n".join(f"{n}={secrets.token_urlsafe(24)}" for n in
              ("POSTGRES_PASSWORD", "DOCINTEL_DB_PASSWORD", "DOCINTEL_REDIS_PASSWORD", "DOCINTEL_METRICS_TOKEN"))
              + f"\nDOCINTEL_API_KEYS_PATH={d / 'api_keys.json'}\nDOCINTEL_WORKER_CONCURRENCY=2\n")
          PY
      - name: Build images
        run: docker compose -p ci -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/deploy.env" build
      - name: Images run as non-root; API image has OCR and office conversion
        run: |
          docker run --rm --entrypoint sh docintel:2.0.0 -c 'test "$(id -u)" != 0 && tesseract --version && which soffice && docintel --help'
          docker run --rm --entrypoint sh docintel-embedder:2.0.0 -c 'test "$(id -u)" != 0 && ls /models'
      - name: Start the stack
        run: |
          docker compose -p ci -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/deploy.env" up -d
          for i in $(seq 1 120); do curl -fs http://localhost:8000/health/ready && exit 0; sleep 5; done
          docker compose -p ci -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/deploy.env" ps; exit 1
      - run: pip install -e ".[dev]"
      - name: End-to-end verification
        run: >
          python scripts/verify_deployment.py http://localhost:8000 "$RUNNER_TEMP/keys.json"
          -p ci -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/deploy.env"
      - name: Logs
        if: failure()
        run: docker compose -p ci -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/deploy.env" logs --tail 200
