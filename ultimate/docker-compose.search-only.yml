# Search-only deployment (standalone file).
# Deploy this file by itself on the search server.
#
# Milvus + Redis point to the PROCESSING server's PRIVATE address (required, no default):
#   MILVUS_HOST=<processing-private-ip>  REDIS_URL=redis://:<REDIS_PASSWORD>@<processing-private-ip>:6379/0
#
# Run:
#   docker-compose -f docker-compose.search-only.yml up -d --build
#   # or via universal_deploy.sh (STAGING_ROLE=search, ULTIMATE_ENV_FILE=...)
#
# Never point these at a public IP: Redis and Milvus must only be reachable on a private network.
# Compose project name: docker-compose v1.x ignores top-level `name:` — use explicit -p.
#   universal_deploy.sh: -p ultimate-search
#   Manual:   export COMPOSE_PROJECT_NAME=ultimate-search
# Remote Milvus/Redis: docker-compose.deploy.generated.yml + ULTIMATE_ENV_FILE on host.
#
# Stable container_name on the API only. Embedder may be scaled (replicas>1) via generated override — then
# Compose keeps generated names (ultimate-search_ultimate-embedder-search_1, …).

services:
  ultimate-search:
    container_name: ultimate-search-api
    build:
      context: ..
      dockerfile: ultimate/Dockerfile.ultimate
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - search_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "4"
      - --timeout-keep-alive
      - "600"
    env_file:
      - ${ULTIMATE_ENV_FILE:-docker.staging.env}
    environment:
      PYTHONPATH: /app
      SEARCH_ONLY: "true"
      API_KEYS_FILE: /run/secrets/xocr_api_keys.json
      SEARCH_DEFAULT_METHOD: both
      SEARCH_REQUEST_TIMEOUT: "60"
      SEMANTIC_STRICTNESS: precision
      ENABLE_QUERY_NER: "0"
      # ── Processing server connections ──────────────────────────────────────
      # These override ULTIMATE_ENV_FILE values (MILVUS_HOST=milvus / REDIS_HOST=redis)
      # which only exist on the processing server as local Docker service names.
      #
      # Use the processing server's private address; allow TCP 19530 + 6379 only
      # from the search server (security group / firewall), never from the internet.
      MILVUS_HOST: ${MILVUS_HOST:?Set MILVUS_HOST to the processing server private address}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL (redis://:password@private-host:6379/0)}
      # REDIS_HOST/PORT/DB mirror REDIS_URL for code paths that build the URL
      # from individual parts (avoids env file "redis" hostname being used when remote).
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      # ──────────────────────────────────────────────────────────────────────
      EMBEDDER_SEARCH_URL: http://ultimate-embedder-search:8080/embed
      # This server is a subscriber: reads the metadata index from Redis,
      # never writes. Processing server (METADATA_INDEX_PUBLISHER=true in
      # env file) is the sole publisher. Explicit override so a stale env file
      # value cannot bleed through.
      METADATA_INDEX_PUBLISHER: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./ultimate_ui.py:/app/ultimate_ui.py
      - ./search_api.py:/app/search_api.py
      - ${API_KEYS_HOST_FILE:-./secrets/api_keys.json}:/run/secrets/xocr_api_keys.json:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - ultimate-embedder-search
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ultimate-search

  ultimate-embedder-search:
    build:
      context: ..
      dockerfile: ultimate/Dockerfile.ultimate
    command:
      - uvicorn
      - src.embedder_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "4"
    env_file:
      - ${ULTIMATE_ENV_FILE:-docker.staging.env}
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      VECLIB_MAXIMUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 90s
    networks:
      - ultimate-search

networks:
  ultimate-search:
    driver: bridge
